<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">

<title>鐚挭绠″ v1.04</title>
<style>
/ ========== CSS Variables ========== /
:root {

  --radius-xs: 6px;

}

[data-theme="dark"] {
  --bg: #1a1816;
  --bg-card: #262320;
  --bg-input: #2e2a25;
  --text: #e8e0d5;
  --text-secondary: #a89880;
  --text-muted: #6e6050;
  --border: #3a3228;
  --shadow: 0 2px 12px rgba(0,0,0,0.25);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.35);

/ ========== Reset ========== /
, ::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;

  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/ ========== App Shell ========== /
.app {

  margin: 0 auto;
  min-height: 100vh;

  padding-bottom: var(--tab-height);
}

.header {

  display: flex;
  align-items: center;

.header-title {

@keyframes fadeIn {

}

/ ========== Tab Bar ========== /
.tab-bar {

.modal-overlay {

.chip.color-bath { --chip-color: var(--event-bath); }
.chip.color-checkup { --chip-color: var(--event-checkup); }
.chip.color-nail_trim { --chip-color: var(--event-nail_trim); }

.chip.color-deworm.selected { background: var(--event-deworm); border-color: var(--event-deworm); }
.chip.color-vaccine.selected { background: var(--event-vaccine); border-color: var(--event-vaccine); }
.chip.color-bath.selected { background: var(--event-bath); border-color: var(--event-bath); }
.chip.color-checkup.selected { background: var(--event-checkup); border-color: var(--event-checkup); }
.chip.color-nail_trim.selected { background: var(--event-nail_trim); border-color: var(--event-nail_trim); }
.chip.color-litter_box.selected { background: var(--event-litter_box); border-color: var(--event-litter_box); }

.btn {
  padding: 11px 24px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-danger { background: var(--error); color: #fff; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }

/ ========== History ========== /
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 10px;
  flex-wrap: wrap;
}

.history-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.batch-bar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  box-shadow: var(--shadow);

}

.batch-bar.visible { display: flex; }

.batch-bar input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
.batch-bar .batch-count { color: var(--primary); font-weight: 700; }

.record-list { display: flex; flex-direction: column; gap: 8px; }

.record-item {

}

.record-item .record-inner {

}

.record-item .record-checkbox {

  height: 20px;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.record-item.batch .record-checkbox { display: block; }
.record-item.batch .record-inner { pointer-events: none; }

.record-item .record-date {

}

.settings-section {

  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);

}

}

.theme-dot {

/ ========== Toast ========== /
.toast-container {

  left: 50%;

  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;

  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 600px) {

<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <span class="header-title"><span class="ears">馃惐</span>鐚挭绠″</span>

function initSupabase() {
  try {
    if (typeof window.supabase === 'undefined') {
      console.warn('Supabase CDN script not loaded (window.supabase is undefined). Check CDN URL.');
      return false;
    }
    if (typeof window.supabase.createClient !== 'function') {
      console.warn('Supabase CDN loaded but createClient is not a function. CJS build loaded instead of UMD.');
      return false;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log('Supabase client initialized successfully');
    // setupRealtime has its own try-catch; don't let it block init
    try { setupRealtime(); } catch (e) { console.warn('Realtime init threw:', e); }
    return true;
  } catch (e) {
    console.warn('Supabase init failed:', e.message || e);
    return false;
  }
}

function setupRealtime() {
  if (!sb) return;
  try {
    sb.channel('cats-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cats' }, (payload) => {
        handleRealtimeCat(payload);
      })
      .subscribe();

    sb.channel('records-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, (payload) => {
        handleRealtimeRecord(payload);
      })
      .subscribe();
  } catch (e) {
    console.warn('Realtime setup failed:', e);
  }
}

function handleRealtimeCat(payload) {
  const { eventType, new: newRow, old: oldRow } = payload;
  if (eventType === 'INSERT') {
    if (!cats.find(c => c.id === newRow.id)) {
      cats.push(newRow);
    }
  } else if (eventType === 'UPDATE') {
    const idx = cats.findIndex(c => c.id === newRow.id);
    if (idx >= 0) cats[idx] = newRow;
  } else if (eventType === 'DELETE') {
    cats = cats.filter(c => c.id !== oldRow.id);
  }
  saveLocalCats();
  refreshAllViews();
}

function handleRealtimeRecord(payload) {
  const { eventType, new: newRow, old: oldRow } = payload;
  if (eventType === 'INSERT') {
    if (!records.find(r => r.id === newRow.id)) {
      records.push(newRow);
    }
  } else if (eventType === 'UPDATE') {
    const idx = records.findIndex(r => r.id === newRow.id);
    if (idx >= 0) records[idx] = newRow;
  } else if (eventType === 'DELETE') {
    records = records.filter(r => r.id !== oldRow.id);
  }
  saveLocalRecords();
  refreshCalendarAndHistory();
}

// ========== Data Operations ==========
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function saveLocalCats() { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(cats)); }
function saveLocalRecords() { localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records)); }

function loadLocalData() {
  try {
    const c = localStorage.getItem(STORAGE_KEY_CATS);
    if (c) cats = JSON.parse(c);
    const r = localStorage.getItem(STORAGE_KEY_RECORDS);
    if (r) records = JSON.parse(r);
  } catch (e) { console.warn('localStorage load failed'); }
}

async function loadRemoteData() {
  if (!sb) return;
  try {
    const { data: remoteCats } = await sb.from('cats').select('*');
    if (remoteCats) {
      const localMap = new Map(cats.map(c => [c.id, c]));
      remoteCats.forEach(rc => localMap.set(rc.id, rc));
      cats = [...localMap.values()];
      saveLocalCats();
      // Push local-only cats to remote
      for (const c of cats) {
        if (!remoteCats.find(rc => rc.id === c.id)) await saveCatToRemote(c);
      }
    }
    const { data: remoteRecs } = await sb.from('records').select('*');
    if (remoteRecs) {
      const localMap = new Map(records.map(r => [r.id, r]));
      remoteRecs.forEach(rr => localMap.set(rr.id, rr));
      records = [...localMap.values()];
      saveLocalRecords();
      for (const r of records) {
        if (!remoteRecs.find(rr => rr.id === r.id)) await saveRecordToRemote(r);
      }
    }
  } catch (e) { console.warn('Remote load failed:', e); }
}

async function saveCatToRemote(cat) {
  if (!sb) return false;
  try {
    const { error } = await sb.from('cats').upsert(cat);
    return !error;
  } catch (e) { return false; }
}

async function deleteCatFromRemote(id) {
  if (!sb) return false;
  try {
    const { error } = await sb.from('cats').delete().eq('id', id);
    return !error;
  } catch (e) { return false; }
}

async function saveRecordToRemote(record) {

    return !error;

}

// ========== Dashboard Rendering ==========
function renderDashboard() {
  const grid = document.getElementById('catsGrid');
  const empty = document.getElementById('emptyState');

  if (cats.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = cats.map(cat => {
    const age = cat.birth ? calcAge(cat.birth) : '鏈煡';
    const avatarSrc = cat.photo || '';
    const filteredClass = cat.photo && cat.photo.startsWith('data:') ? ' anime-filtered' : '';
    return `
      <div class="cat-card" data-cat-id="${cat.id}">
        <div class="cat-ear"></div>
        <img class="cat-avatar${filteredClass}" src="${avatarSrc || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect fill="%23e8e0d5" width="64" height="64" rx="32"/><text x="32" y="40" text-anchor="middle" font-size="28">馃惐</text></svg>')}" alt="${cat.name}" loading="lazy">
        <div class="cat-name">${escapeHtml(cat.name)}</div>
        <div class="cat-info">${escapeHtml(cat.breed || '鏈煡鍝佺')} 路 ${escapeHtml(cat.color || '鏈煡')}</div>
        <div class="cat-info">${age} 路 ${cat.weight ? cat.weight + 'kg' : '鏈煡浣撻噸'}</div>
      </div>`;
  }).join('');
}

function calcAge(birthStr) {
  if (!birthStr) return '鏈煡';
  const birth = new Date(birthStr);
  const now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  let months = now.getMonth() - birth.getMonth();
  if (months < 0) { years--; months += 12; }
  if (years > 0) return ${years}宀?{months}涓湀;
  if (months > 0) return ${months}涓湀;
  const days = Math.floor((now - birth) / 86400000);
  return ${Math.max(0, days)}澶?
}

// ========== Calendar Rendering ==========
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calMonth').textContent = ${year}骞?{month + 1}鏈?

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const todayStr = formatDateStr(today);

  // Build event map
  const eventMap = {};
  records.forEach(r => {
    if (!eventMap[r.date]) eventMap[r.date] = new Set();
    eventMap[r.date].add(r.type);
  });

  const grid = document.getElementById('calGrid');
  let html = '';

  // Previous month fill
  const prevDays = new Date(year, month, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevDays - i;
    const dateStr = formatDateStr(new Date(year, month - 1, d));
    html += renderDayCell(d, dateStr, true, todayStr, eventMap);
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = formatDateStr(new Date(year, month, d));
    html += renderDayCell(d, dateStr, false, todayStr, eventMap);
  }

  // Next month fill
  const remaining = 42 - firstDay - daysInMonth;
  for (let d = 1; d <= remaining; d++) {
    const dateStr = formatDateStr(new Date(year, month + 1, d));
    html += renderDayCell(d, dateStr, true, todayStr, eventMap);
  }

  grid.innerHTML = html;

  // Relative date
  updateRelativeDate();
}

function renderDayCell(day, dateStr, isOtherMonth, todayStr, eventMap) {
  const isToday = dateStr === todayStr;
  const isSelected = dateStr === selectedDay;
  let cls = 'day-cell';
  if (isOtherMonth) cls += ' other-month';
  if (isToday && !isSelected) cls += ' today';
  if (isSelected) cls += ' selected';

  let tagsHtml = '';
  const types = eventMap[dateStr];
  if (types) {
    const typeArr = [...types];
    const showTypes = typeArr.slice(0, 2);
    const extra = typeArr.length - 2;
    tagsHtml = '<div class="event-tags">' +
      showTypes.map(t => {
        const evt = EVENT_TYPES[t] || { label: t, color: '#999' };
        return <span class="event-tag" style="background:${evt.color}">${evt.label}</span>;
      }).join('') +
      (extra > 0 ? <span class="event-tag tag-more">+${extra}</span> : '') +
      '</div>';
  }

  return <div class="${cls}" data-date="${dateStr}"><span class="day-num">${day}</span>${tagsHtml}</div>;
}

function updateRelativeDate() {
  const el = document.getElementById('calRelative');
  const target = selectedDay ? new Date(selectedDay + 'T00:00:00') : new Date();
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) el.textContent = '浠婂ぉ';
  else if (diff === 1) el.textContent = '鏄庡ぉ';
  else if (diff === -1) el.textContent = '鏄ㄥぉ';
  else if (diff > 0) el.textContent = ${diff}澶╁悗;
  else el.textContent = ${Math.abs(diff)}澶╁墠;
}

function formatDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return ${y}-${m}-${d};
}

// ========== History Rendering ==========
function renderHistory() {
  const list = document.getElementById('recordList');
  const empty = document.getElementById('historyEmpty');
  const filterGroup = document.getElementById('historyCatFilter');
  const batchBar = document.getElementById('batchBar');
  const batchToggle = document.getElementById('batchToggle');

  const EVENT_ICONS = {
    deworm: '馃拪', vaccine: '馃拤', bath: '馃泚',
    checkup: '馃┖', nail_trim: '鉁傦笍', litter_box: '馃毥'
  };

  function formatDateFull(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const weekdays = ['鏃?, '涓€', '浜?, '涓?, '鍥?, '浜?, '鍏?];
    return ${y}骞?{m}鏈?{day}鏃?鍛?{weekdays[d.getDay()]};
  }

  // Cat filter chips
  filterGroup.innerHTML = <span class="chip${historyCatFilter === 'all' ? ' selected' : ''}" data-cat="all">鍏ㄩ儴</span> +
    cats.map(c => <span class="chip${historyCatFilter === c.id ? ' selected' : ''}" data-cat="${c.id}">${escapeHtml(c.name)}</span>).join('');

  // Filter records
  let filtered = records;
  if (historyCatFilter !== 'all') {
    filtered = records.filter(r => r.cat_id === historyCatFilter);
  }
  filtered.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.innerHTML = filtered.map(r => {
      const cat = findCatById(r.cat_id);
      const catName = cat ? cat.name : '鏈煡鐚挭';
      const evt = EVENT_TYPES[r.type] || { label: r.type, color: '#999' };
      const icon = EVENT_ICONS[r.type] || '馃搶';
      const checked = selectedRecordIds.has(r.id) ? ' checked' : '';
      const batchCls = batchMode ? ' batch' : '';
      return `
        <div class="record-item${batchCls}" data-record-id="${r.id}">
          <div class="record-inner">
            <input type="checkbox" class="record-checkbox"${checked} data-id="${r.id}">
            <span class="record-date">${formatDateFull(r.date)}</span>
            <span class="record-cat">${escapeHtml(catName)}</span>
            <span class="record-type-icon" title="${evt.label}">${icon}</span>
            <span class="record-type-tag tag-${r.type}">${evt.label}</span>
            <span class="record-note">${escapeHtml(r.note || '')}</span>
          </div>
          <div class="delete-zone">鍒犻櫎</div>
        </div>`;
    }).join('');
  }

  // Batch bar
  document.getElementById('batchSelectAll').checked = false;
  updateBatchUI();
}

function updateBatchUI() {
  const batchBar = document.getElementById('batchBar');
  if (batchMode) {
    batchBar.classList.add('visible');
    const total = document.querySelectorAll('#recordList .record-item').length;
    document.getElementById('batchCount').textContent = selectedRecordIds.size;
    document.getElementById('batchTotal').textContent = total;
  } else {
    batchBar.classList.remove('visible');
  }
}

// ========== Anime Filter ==========
function applyAnimeFilter(img) {
  const maxW = 300, maxH = 300;
  let w = img.width, h = img.height;
  if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
  if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }

  // Source canvas
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = w; srcCanvas.height = h;
  const sctx = srcCanvas.getContext('2d');
  sctx.drawImage(img, 0, 0, w, h);
  const src = sctx.getImageData(0, 0, w, h);
  const data = src.data;

  // Step 1: Bilateral filter (edge-preserving smooth)
  bilateralFilter(data, w, h, 2, 40);

  // Step 2: Simplified color quantization (posterize + palette reduction)
  kmeansQuantize(data, w, h, 10);

  // Step 3: Saturation boost 1.3x + warm color shift (+10 hue)
  adjustHSL(data, w, h, 1.3, 10);

  // Step 4: Gaussian blur
  const blurData = gaussianBlur3x3(data, w, h);

  // Step 5: USM sharpen (amount=1.0)
  usmSharpen(data, blurData, w, h, 1.0);

  // Step 6: Warm overlay (#ffd4c4 at 8% opacity)
  applyOverlay(data, w, h, 255, 212, 196, 0.08);

  // Put processed data back
  sctx.putImageData(src, 0, 0);

  // Output: rounded corners + soft shadow (anime card feel)
  return renderAnimeCard(srcCanvas, w, h);
}

// --- Bilateral filter (3x3 kernel) ---
function bilateralFilter(data, w, h, radius, sigmaR) {
  const r = radius || 2;
  const sr = sigmaR || 40;
  const sS = r; // spatial sigma
  const tmp = new Uint8ClampedArray(data);
  const spatialWeights = [];
  const kSize = 2 * r + 1;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      spatialWeights.push(Math.exp(-(dxdx + dydy) / (2  sS  sS)));
    }
  }
  const twoSigmaR2 = 2  sr  sr;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ci = (y  w + x)  4;
      const cr = tmp[ci], cg = tmp[ci+1], cb = tmp[ci+2];
      let sumR = 0, sumG = 0, sumB = 0, totalW = 0;
      let wi = 0;
      for (let dy = -r; dy <= r; dy++) {
        const ny = y + dy;
        if (ny < 0 || ny >= h) { wi += kSize; continue; }
        for (let dx = -r; dx <= r; dx++) {
          const nx = x + dx;
          if (nx < 0 || nx >= w) { wi++; continue; }
          const ni = (ny  w + nx)  4;
          const nr = tmp[ni], ng = tmp[ni+1], nb = tmp[ni+2];
          const dr = cr - nr, dg = cg - ng, db = cb - nb;
          const colorDist = drdr + dgdg + db*db;
          const wgt = spatialWeights[wi] * Math.exp(-colorDist / twoSigmaR2);
          sumR += nr  wgt; sumG += ng  wgt; sumB += nb * wgt;
          totalW += wgt;
          wi++;
        }
      }
      data[ci] = totalW > 0 ? Math.round(sumR / totalW) : cr;
      data[ci+1] = totalW > 0 ? Math.round(sumG / totalW) : cg;
      data[ci+2] = totalW > 0 ? Math.round(sumB / totalW) : cb;
    }
  }
}

// --- K-means color quantization ---
function kmeansQuantize(data, w, h, k) {
  if (k < 2) k = 8;
  // Sample pixels (every 4th)
  const samples = [];
  for (let y = 0; y < h; y += 4) {
    for (let x = 0; x < w; x += 4) {
      const i = (y  w + x)  4;
      samples.push([data[i], data[i+1], data[i+2]]);
    }
  }
  if (samples.length < k) k = samples.length;
  if (k < 2) return;

  // Initialize centroids using k-means++ style (first random, then farthest)
  const centroids = [];
  centroids.push(samples[Math.floor(Math.random() * samples.length)].slice());
  for (let c = 1; c < k; c++) {
    let maxDist = -1, best = samples[0];
    for (const s of samples) {
      let minD = Infinity;
      for (const ct of centroids) {
        const d = (s[0]-ct[0])2 + (s[1]-ct[1])2 + (s[2]-ct[2])**2;
        if (d < minD) minD = d;
      }
      if (minD > maxDist) { maxDist = minD; best = s; }
    }
    centroids.push(best.slice());
  }

  // Lloyd iterations
  const labels = new Array(samples.length);
  for (let iter = 0; iter < 8; iter++) {
    // Assign
    for (let i = 0; i < samples.length; i++) {
      let minD = Infinity, bestC = 0;
      for (let j = 0; j < k; j++) {
        const c = centroids[j];
        const d = (samples[i][0]-c[0])2 + (samples[i][1]-c[1])2 + (samples[i][2]-c[2])**2;
        if (d < minD) { minD = d; bestC = j; }
      }
      labels[i] = bestC;
    }
    // Update
    const sums = Array.from({length: k}, () => [0, 0, 0, 0]);
    for (let i = 0; i < samples.length; i++) {
      const c = labels[i];
      sums[c][0] += samples[i][0]; sums[c][1] += samples[i][1];
      sums[c][2] += samples[i][2]; sums[c][3]++;
    }
    for (let j = 0; j < k; j++) {
      if (sums[j][3] > 0) {
        centroids[j] = [Math.round(sums[j][0]/sums[j][3]), Math.round(sums[j][1]/sums[j][3]), Math.round(sums[j][2]/sums[j][3])];
      }
    }
  }

  // Quantize all pixels
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y  w + x)  4;
      const r = data[i], g = data[i+1], b = data[i+2];
      let minD = Infinity, bestC = 0;
      for (let j = 0; j < k; j++) {
        const c = centroids[j];
        const d = (r-c[0])2 + (g-c[1])2 + (b-c[2])**2;
        if (d < minD) { minD = d; bestC = j; }
      }
      data[i] = centroids[bestC][0];
      data[i+1] = centroids[bestC][1];
      data[i+2] = centroids[bestC][2];
    }
  }
}

// --- HSL adjustment: saturation * factor, hue + offset ---
function adjustHSL(data, w, h, satFactor, hueOffset) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y  w + x)  4;
      let r = data[i] / 255, g = data[i+1] / 255, b = data[i+2] / 255;
      const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
      const l = (maxC + minC) / 2;
      if (maxC === minC) continue; // gray
      const d = maxC - minC;
      let s = l > 0.5 ? d / (2 - maxC - minC) : d / (maxC + minC);
      // Hue
      let h;
      if (maxC === r) h = ((g - b) / d) % 6;
      else if (maxC === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
      // Adjust
      h = (h + hueOffset + 360) % 360;
      s = Math.min(1, s * satFactor);
      // Convert back
      const c = (1 - Math.abs(2  l - 1))  s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let rr, gg, bb;
      if (h < 60) { rr = c; gg = x; bb = 0; }
      else if (h < 120) { rr = x; gg = c; bb = 0; }
      else if (h < 180) { rr = 0; gg = c; bb = x; }
      else if (h < 240) { rr = 0; gg = x; bb = c; }
      else if (h < 300) { rr = x; gg = 0; bb = c; }
      else { rr = c; gg = 0; bb = x; }
      data[i] = Math.round((rr + m) * 255);
      data[i+1] = Math.round((gg + m) * 255);
      data[i+2] = Math.round((bb + m) * 255);
    }
  }
}

// --- 3x3 Gaussian blur ---
function gaussianBlur3x3(data, w, h) {
  const kernel = [1, 2, 1, 2, 4, 2, 1, 2, 1]; // normalized by /16
  const out = new Uint8ClampedArray(data);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const ci = (y  w + x)  4;
      for (let ch = 0; ch < 3; ch++) {
        let sum = 0;
        let ki = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            sum += data[((y+dy)  w + (x+dx))  4 + ch] * kernel[ki++];
          }
        }
        out[ci + ch] = Math.round(sum / 16);
      }
    }
  }
  return out;
}

// --- Unsharp Mask ---
function usmSharpen(data, blurred, w, h, amount) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y  w + x)  4;
      for (let ch = 0; ch < 3; ch++) {
        const orig = data[i + ch];
        const mask = orig - blurred[i + ch];
        data[i + ch] = Math.min(255, Math.max(0, Math.round(orig + mask * amount)));
      }
    }
  }
}

// --- Warm overlay ---
function applyOverlay(data, w, h, or, og, ob, opacity) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y  w + x)  4;
      data[i] = Math.round(data[i]  (1 - opacity) + or  opacity);
      data[i+1] = Math.round(data[i+1]  (1 - opacity) + og  opacity);
      data[i+2] = Math.round(data[i+2]  (1 - opacity) + ob  opacity);
    }
  }
}

// --- Render with rounded corners and shadow ---
function renderAnimeCard(srcCanvas, w, h) {
  const pad = 14;
  const radius = 14;
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = w + pad * 2;
  finalCanvas.height = h + pad * 2;
  const fctx = finalCanvas.getContext('2d');

  // Soft shadow
  fctx.shadowColor = 'rgba(60, 40, 20, 0.22)';
  fctx.shadowBlur = 14;
  fctx.shadowOffsetX = 0;
  fctx.shadowOffsetY = 5;

  // Rounded rect path
  fctx.beginPath();
  fctx.moveTo(pad + radius, pad);
  fctx.arcTo(pad + w, pad, pad + w, pad + radius, radius);
  fctx.arcTo(pad + w, pad + h, pad + w - radius, pad + h, radius);
  fctx.arcTo(pad, pad + h, pad, pad + h - radius, radius);
  fctx.arcTo(pad, pad, pad + radius, pad, radius);
  fctx.closePath();
  fctx.save();
  fctx.clip();
  fctx.drawImage(srcCanvas, pad, pad);
  fctx.restore();

  // Draw again without shadow for the clip (shadow only on outer shape)
  // Actually we need shadow on the shape before clip. Let's redraw:
  fctx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
  fctx.save();
  fctx.shadowColor = 'rgba(60, 40, 20, 0.22)';
  fctx.shadowBlur = 14;
  fctx.shadowOffsetX = 0;
  fctx.shadowOffsetY = 5;
  fctx.beginPath();
  fctx.moveTo(pad + radius, pad);
  fctx.arcTo(pad + w, pad, pad + w, pad + radius, radius);
  fctx.arcTo(pad + w, pad + h, pad + w - radius, pad + h, radius);
  fctx.arcTo(pad, pad + h, pad, pad + h - radius, radius);
  fctx.arcTo(pad, pad, pad + radius, pad, radius);
  fctx.closePath();
  fctx.fillStyle = '#fff';
  fctx.fill();
  fctx.restore();

  // Draw image clipped
  fctx.save();
  fctx.beginPath();
  fctx.moveTo(pad + radius, pad);
  fctx.arcTo(pad + w, pad, pad + w, pad + radius, radius);
  fctx.arcTo(pad + w, pad + h, pad + w - radius, pad + h, radius);
  fctx.arcTo(pad, pad + h, pad, pad + h - radius, radius);
  fctx.arcTo(pad, pad, pad + radius, pad, radius);
  fctx.closePath();
  fctx.clip();
  fctx.drawImage(srcCanvas, pad, pad);
  fctx.restore();

  return finalCanvas.toDataURL('image/jpeg', 0.88);
}

  document.getElementById('fabAdd').addEventListener('click', function() {
    if (currentPage === 'dashboard') showCatForm();
    else if (currentPage === 'calendar') {
      const today = formatDateStr(new Date());
      showRecordForm(today);
    }
  });

  // Calendar grid clicks
  document.getElementById('calGrid').addEventListener('click', function(e) {
    const cell = e.target.closest('.day-cell');
    if (!cell) return;
    const dateStr = cell.dataset.date;
    if (!dateStr) return;

    // Toggle selected
    if (selectedDay === dateStr) {
      selectedDay = null;
    } else {
      selectedDay = dateStr;
    }
    renderCalendar();

    // Show record form
    showRecordForm(dateStr);
  });

  // Calendar navigation
  document.getElementById('calPrev').addEventListener('click', function() {
    currentMonth.setMonth(currentMonth.getMonth() - 1);
    selectedDay = null;
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', function() {
    currentMonth.setMonth(currentMonth.getMonth() + 1);
    selectedDay = null;
    renderCalendar();
  });
  document.getElementById('calToday').addEventListener('click', function() {
    currentMonth = new Date();
    selectedDay = null;
    renderCalendar();
  });

  // Date picker quick jump
  document.getElementById('calDatePicker').addEventListener('change', function() {
    const val = this.value;
    if (!val) return;
    const parts = val.split('-');
    currentMonth = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1);
    selectedDay = val;
    renderCalendar();
  });

  // History cat filter
  document.getElementById('historyCatFilter').addEventListener('click', function(e) {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    historyCatFilter = chip.dataset.cat;
    selectedRecordIds.clear();
    renderHistory();
  });

  // History swipe delete
  const recordList = document.getElementById('recordList');
  recordList.addEventListener('touchstart', handleSwipeStart, { passive: true });
  recordList.addEventListener('touchmove', handleSwipeMove, { passive: false });
  recordList.addEventListener('touchend', handleSwipeEnd);
  recordList.addEventListener('mousedown', handleSwipeStart);

  // History delete zone click
  recordList.addEventListener('click', function(e) {
    if (batchMode) return;
    const delZone = e.target.closest('.delete-zone');
    if (!delZone) return;
    const item = delZone.closest('.record-item');
    if (!item) return;
    const id = item.dataset.recordId;
    if (id) deleteRecord(id);
  });

  // History checkbox click in batch mode
  recordList.addEventListener('change', function(e) {
    if (!batchMode) return;
    const cb = e.target.closest('.record-checkbox');
    if (!cb) return;
    const id = cb.dataset.id;
    if (cb.checked) selectedRecordIds.add(id);
    else selectedRecordIds.delete(id);
    updateBatchUI();
  });

  // Batch toggle
  document.getElementById('batchToggle').addEventListener('click', function() {
    batchMode = !batchMode;
    selectedRecordIds.clear();
    const toggle = document.getElementById('batchToggle');
    toggle.textContent = batchMode ? '鍙栨秷' : '閫夋嫨';
    renderHistory();
  });

  // Batch select all
  document.getElementById('batchSelectAll').addEventListener('change', function() {
    const items = document.querySelectorAll('#recordList .record-item');
    selectedRecordIds.clear();
    if (this.checked) {
      items.forEach(item => selectedRecordIds.add(item.dataset.recordId));
    }
    // Update checkboxes
    document.querySelectorAll('#recordList .record-checkbox').forEach(cb => {
      cb.checked = this.checked;
    });
    updateBatchUI();
  });

  // Batch delete
  document.getElementById('batchDelete').addEventListener('click', async function() {
    if (selectedRecordIds.size === 0) { showToast('璇峰厛閫夋嫨璁板綍', 'error'); return; }
    if (confirm(纭畾鍒犻櫎 ${selectedRecordIds.size} 鏉¤褰曞悧锛?) {
      await deleteRecords(selectedRecordIds);
      batchMode = false;
      document.getElementById('batchToggle').textContent = '閫夋嫨';
      renderHistory();
    }
  });

  // Theme dots
  document.getElementById('themeDots').addEventListener('click', function(e) {
    const dot = e.target.closest('.theme-dot');
    if (!dot) return;
    const color = dot.dataset.theme;
    setTheme(color);
  });

  // Dark mode toggle
  document.getElementById('darkToggle').addEventListener('click', function() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    this.classList.toggle('on', !isDark);
    localStorage.setItem(STORAGE_KEY_DARK, !isDark ? 'dark' : 'light');
  });

  // Close modal on Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
}

function handleSwipeStart(e) {
  if (batchMode) return;
  const item = e.target.closest('.record-item');
  if (!item) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  swipeState = { target: item, startX: x, movedX: 0, swiping: true };
}

function handleSwipeMove(e) {
  if (!swipeState.swiping || batchMode) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const dx = x - swipeState.startX;
  swipeState.movedX = dx;
  if (dx < 0) {
    e.preventDefault();
    const translate = Math.max(-80, dx);
    swipeState.target.querySelector('.record-inner').style.transform = translateX(${translate}px);
    if (dx < -60) swipeState.target.classList.add('swiped');
    else swipeState.target.classList.remove('swiped');
  }
}

function handleSwipeEnd() {
  if (!swipeState.swiping) return;
  if (swipeState.movedX > -30) {
    swipeState.target.classList.remove('swiped');
    swipeState.target.querySelector('.record-inner').style.transform = '';
  }
  swipeState = { target: null, startX: 0, movedX: 0, swiping: false };
}

// Global mouse up for swipe
document.addEventListener('mouseup', function() {
  if (swipeState.swiping) handleSwipeEnd();
});
document.addEventListener('mousemove', function(e) {
  if (swipeState.swiping) handleSwipeMove(e);
});

// ========== Page Switching ==========
function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));

  const fab = document.getElementById('fabAdd');
  if (page === 'dashboard') {
    fab.style.display = 'flex';
    fab.textContent = '+';
  } else if (page === 'calendar') {
    fab.style.display = 'flex';
    fab.textContent = '+';
  } else {
    fab.style.display = 'none';
  }

  if (page === 'calendar') renderCalendar();
  if (page === 'history') renderHistory();
  if (page === 'settings') renderSettings();
}

// ========== Theme ==========
function setTheme(color) {
  document.documentElement.style.setProperty('--primary', color);
  document.documentElement.style.setProperty('--primary-rgb', hexToRgb(color));
  localStorage.setItem(STORAGE_KEY_THEME, color);
  renderSettings();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return ${r}, ${g}, ${b};
}

// ========== Online/Offline ==========
function updateOnlineStatus() {
  const networkOk = navigator.onLine;
  const supabaseOk = !!sb;
  isOnline = networkOk && supabaseOk;
  const dot = document.getElementById('syncDot');

  if (isOnline) {
    dot.className = 'sync-dot online';
    dot.title = '鍦ㄧ嚎 - 瀹炴椂鍚屾';
  } else if (networkOk && !supabaseOk) {
    dot.className = 'sync-dot offline';
    dot.title = '鍚屾鏈嶅姟鏈繛鎺?;
  } else {
    dot.className = 'sync-dot offline';
    dot.title = '绂荤嚎 - 鏈湴瀛樺偍';
  }

  if (isOnline) {
    loadRemoteData().then(() => refreshAllViews());
  }
}

// ========== Utilities ==========
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== Init ==========
async function init() {
  // Load theme
  const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
  if (savedTheme) setTheme(savedTheme);

  // Load dark mode
  const savedDark = localStorage.getItem(STORAGE_KEY_DARK);
  if (savedDark === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('darkToggle').classList.add('on');
  }

  // Load local data first
  loadLocalData();

  // Render immediately with local data (before any network wait)
  refreshAllViews();

  // Setup events immediately (critical: must run before any async block)
  setupGlobalEvents();

  // Listen for online/offline
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  // Init Supabase and load remote data in background
  // Strategy: poll + CDN onload event, 30s timeout
  const supabaseOk = await new Promise(resolve => {
    let resolved = false;
    const done = result => { if (!resolved) { resolved = true; resolve(result); } };
    const start = Date.now();
    const MAX_WAIT = 30000;

    function attempt() { if (initSupabase()) done(true); }

    // CDN onload: check immediately and also poll briefly after
    if (window.__CDN_LOADED) { attempt(); if (resolved) return; }

    // Poll every 300ms
    const timer = setInterval(() => {
      attempt();
      if (resolved) { clearInterval(timer); return; }
      if (Date.now() - start > MAX_WAIT) {
        clearInterval(timer);
        console.warn('Supabase CDN 鍔犺浇瓒呮椂锛屼娇鐢ㄦ湰鍦版ā寮?);
        done(false);
      }
    }, 300);

    // Also watch for CDN onload arriving late
    const orig = Object.getOwnPropertyDescriptor(window, '__CDN_LOADED');
    if (orig?.set) return;
    let _val = window.__CDN_LOADED;
    Object.defineProperty(window, '__CDN_LOADED', {
      get() { return _val; },
      set(v) { _val = v; attempt(); if (resolved) clearInterval(timer); },
      configurable: true
    });
  });
  updateOnlineStatus();

  if (supabaseOk && navigator.onLine) {
    try {
      await loadRemoteData();
    } catch (e) {
      console.warn('Remote data load failed:', e.message);
    }
    refreshAllViews(); // Refresh with merged remote data
  }

  console.log('馃惐 鐚挭绠″ v1.04 鍒濆鍖栧畬鎴?);
}

document.addEventListener('DOMContentLoaded', init);
</script>
